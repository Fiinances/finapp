name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version and push tag
        run: |
          NEW_TAG=$(npm version ${{ inputs.bump }} -m "chore: release %s")
          
          # Push para o repositório PRIVADO (onde a action roda)
          git push origin HEAD:main --follow-tags
          
          # Configura e envia para o repositório PÚBLICO
          git remote add public https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/Fiinances/finapp_releases.git
          git push public $NEW_TAG
