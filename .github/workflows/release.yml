name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Permissions only for the private source repo (read is enough here)
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_pattern: 'release/**/*Setup*.exe'
          - os: macos-latest
            artifact_pattern: 'release/**/*.dmg'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: |
          npm run dist:production
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # GH_TOKEN here authorizes electron-builder to publish to finapp_releases
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            ${{ matrix.artifact_pattern }}
            release/**/*.blockmap
            release/**/latest*.yml
          retention-days: 1
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Release on public repo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Finapp ${{ github.ref_name }}
          repository: Fiinances/finapp_releases
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

