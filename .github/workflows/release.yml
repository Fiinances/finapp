name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.2.3)'
        required: false

# Permissions only for the private source repo (read is enough here)
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_pattern: 'release/**/*Setup*.exe'
          - os: macos-latest
            artifact_pattern: 'release/**/*.dmg'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }} # Use o PAT para ter permissão de push
          ref: ${{ github.event.inputs.tag && github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
      
      - name: Sync Tag to Public Repo
        shell: bash
        run: |
          # Define qual tag estamos usando
          CURRENT_TAG=${{ github.event.inputs.tag && github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          
          # Adiciona o remoto público e força o envio da tag
          git remote add public https://x-access-token:${{ secrets.RELEASE_PAT }}@github.com/Fiinances/finapp_releases.git
          
          # Tenta dar push na tag. Se já existir, ele apenas ignora
          git push public $CURRENT_TAG || echo "Tag already exists on public repo"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: |
          npm run dist:production
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # GH_TOKEN here authorizes electron-builder to publish to finapp_releases
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Finalize GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag && github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          name: Finapp ${{ github.event.inputs.tag && github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          repository: Fiinances/finapp_releases
          generate_release_notes: false
          draft: false
          make_latest: true
          allowUpdates: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}

